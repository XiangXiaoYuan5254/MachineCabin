# 在 Windows 上测试并打包机舱：运行单元测试、构建安装包，再对安装后的 App 做端到端冒烟测试。
name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist:win

      - run: node script/smoke_windows.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: MachineCabin-Windows
          path: |
            build/windows/MachineCabin-Setup-*.exe
            website/downloads/latest-windows.json
          if-no-files-found: error
